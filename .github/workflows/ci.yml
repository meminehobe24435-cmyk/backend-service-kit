name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: build & unit test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: 编译（严格告警）
        shell: bash
        run: |
          mkdir -p build
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Iinclude \
              src/http.cpp src/cache.cpp src/service.cpp test/test_bsk.cpp \
              -o build/bsk_test
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Iinclude \
              src/http.cpp src/cache.cpp src/service.cpp src/main.cpp \
              -o build/bsk_sim
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Iinclude \
              src/data.cpp test/test_data.cpp \
              -o build/bsk_dtest

      - name: 单元测试（协议 / 缓存 / 容灾 / 存储）
        shell: bash
        run: ./build/bsk_test

      - name: 单元测试（JSON / XML / 配置并发）
        shell: bash
        run: ./build/bsk_dtest

      - name: 跑四个仿真场景
        shell: bash
        run: |
          ./build/bsk_sim normal    > out_normal.csv    2> out_normal.log
          ./build/bsk_sim degrade   > out_degrade.csv   2> out_degrade.log
          ./build/bsk_sim recover   > out_recover.csv   2> out_recover.log
          ./build/bsk_sim ratelimit > out_ratelimit.csv 2> out_ratelimit.log
          echo "--- normal ---";    tail -n 12 out_normal.log
          echo "--- degrade ---";   tail -n 12 out_degrade.log
          echo "--- recover ---";   tail -n 12 out_recover.log
          echo "--- ratelimit ---"; tail -n 12 out_ratelimit.log

      - name: 上传仿真结果
        uses: actions/upload-artifact@v4
        with:
          name: sim-${{ matrix.os }}
          path: |
            out_*.csv
            out_*.log
          if-no-files-found: error
